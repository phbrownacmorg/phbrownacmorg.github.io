<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>CSC 235 Javascript demo</title>
        <link rel="stylesheet" href="HTML_tags_demo.css">
        <!-- Link to external file.  Nothing beween beginning and ending tags -->
        <script src="jsdemo.js"></script>
        <!-- Script tag in head, just defines functions -->
        <script>
            function updateTime(button) {
                let nextElt = button.nextElementSibling;
                if (nextElt !== null) {
                    nextElt.remove();
                }
                let output = document.createElement('output');
                output.innerHTML = "&nbsp;&nbsp;" + (new Date()).toString();
                button.after(output);
            }
        </script>
    </head>
    <!-- onload event runs when the page is loaded -->
    <body onload="init_page();">
        <h1>Javascript demo</h1>
        <div class="style_properties">
            <h2>Show style properties</h2>
            <select id="style_props" onchange="showValue(this, document.getElementById('get-name'),
                                                            document.getElementById('style_echo_space'));">
                <option value="">&mdash;Choose a property&mdash;</option>
            </select>: <output id="style_echo_space"></output>

        </div>
        <form method="get" action="https://cs.converse.edu/CSC235/formecho.php" onsubmit="return validateForm(this);">
            <fieldset>
                <legend>Monty Python ripoffs</legend>
                <label for="get-name">What is your name?</label>
                <input type="text" id="get-name" name="name" required><output class="flag"></output><br>
                <label for="get-quest">What is your quest?</label>
                <input type="text" id="get-quest" name="quest" required><output class="flag"></output><br>
                <label for="get-color">What is your favorite color?</label>
                <select id="get-color" name="color" required>
                    <option value="">&mdash;Please select an answer&mdash;</option>
                    <optgroup label="Colors">
                        <option>Blue</option>
                        <option>Green</option>
                    </optgroup>
                    <optgroup label="Bad answers">
                        <option>I don't know.  AAAAAUUUUUGGGH!</option>
                    </optgroup>
                </select><output class="flag"></output><br>
                <label for="get-airspeed">What is the airspeed velocity of a swallow carrying a coconut? (m/s)</label>
                0<input type="range" name="airspeed" id="get-airspeed" min="0" max="20" step="0.1" list="airspeeds-list"
                   onmousemove="echoSliderValue(this);">20
                <output class="value" style="margin-left: 2em;"></output>
                <datalist id="airspeeds-list">
                </datalist><br>
            </fieldset>
            <fieldset>
                <legend>Standard biographical stuff</legend>
                <div class="question"><label for="get-dob">Date of birth:</label>
                <input type="date" id="get-dob" name="DOB" value="2006-08-29" min="1906-10-15" max="2026-10-15" required><output class="flag"></output></div>
                <div class="question"><label for="get-pswd">Password</label>
                <input type="password" id="get-pswd" name="password" required pattern="\w{12,}"
                    onchange="validatePassword(this);"><output class="flag"></output></div>
            </fieldset>
            <fieldset>
                <legend>Nosy personal questions</legend>
                <p class="question">I plan to graduate in:<br>
                <span class="radio"><input type="radio" id="get26" name="grad-year"><label for="get26">2026</label></span>
                <span class="radio"><input type="radio" id="get27" name="grad-year"><label for="get27">2027</label></span>
                <span class="radio"><input type="radio" id="get28" name="grad-year"><label for="get28">2028</label></span>
                <span class="radio"><input type="radio" id="get29" name="grad-year" required><label for="get29">2029</label>
                    <output class="flag"></output></span>
                </p>
                <p class="question" id="ice_cream_question">I like the following flavors of ice cream (please check at least one box):
                    <output class="flag invalid"></output><br>
                    <input type="checkbox" id="get-vanilla" name="vanilla" onchange="checkBoxes(this.form);">
                    <label for="get-vanilla">Vanilla</label><br>
                    <input type="checkbox" id="get-chocolate" name="chocolate" onchange="checkBoxes(this.form);">
                    <label for="get-chocolate">Chocolate</label><br>
                    <input type="checkbox" id="get-coffee" name="coffee" onchange="checkBoxes(this.form);">
                    <label for="get-coffee">Coffee</label><br>
                    <input type="checkbox" id="get-bacon" name="bacon" onchange="checkBoxes(this.form);">
                    <label for="get-bacon">Bacon</label><br>
                    <input type="checkbox" id="get-none" name="none" onchange="checkBoxes(this.form);">
                    <label for="get-none">None of the above</label><br>
                </p>
                <input type="hidden" name="not-really-bacon" value="Just kidding, I like bacon but not in ice cream">
                <label for="get-comments">General comments:</label><br>
                <textarea name="comments" id="get-comments"></textarea><br>
            </fieldset>
            <input type="submit"><input type="reset">
        </form>
        <!-- Script tag in body, may display content -->
        <script>
            document.write('<p><button onclick="updateTime(this);">Update time</button></p>');
        </script>
        <noscript>If you had Javascript enabled, you'd be able to click
            a button and see the time.</noscript>
        <div id="stocks">
            <form>
                <fieldset>
                    <legend>Stock value</legend>
                    <span class="form_control">
                        <label>API key:</label>
                        <input type="text" name="API_token" required>
                        <output class="flag"></output>
                    </span>
                    <span class="form_control">
                        <label>Stock symbol:</label>
                        <input type="text" name="symbol" required>
                        <output class="flag"></output>
                    </span>
                    <button type="button" onclick="findStock(this.form);">Find price</button>
                    <span class="form_control block">
                        <output id="stock_output"></output>
                    </span>
                </fieldset>
            </form>
        </div>
        <div class="squares_table">
            <label><var>n:</var></label>
            <input type="number" min="1" step="1" name="n" id="n" value="3">
            <button onclick="insertTable(this.parentElement, this.previousElementSibling.value)">Insert table of squares</button>
        </div>
        <div class="nobel">
            <h2>Look up Nobel laureates</h2>
            <form id="nobel_form">
                <span class="form_control"><label for="nobel_year">Year:</label>
                    <input type="number" min="1901" max="2024" value="1962" name="nobel_year" id="nobel_year"
                            oninput="setCategories(this.form);"></span>
                <span class="form_control"><label for="nobel_cat">Category:</label>
                    <select id="nobel_cat" name="nobel_cat" disabled
                        oninput="showLaureates(this.form);">
                        <option value="">&mdash;Please select a category&mdash;</option>
                    </select></span>
                <span class="form_control block">
                    <output id="nobel_output"></output>
                </span>
            </form>
        </div>
    </body>
</html>
